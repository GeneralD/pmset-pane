name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-prefpane.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/PMSetPane.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
